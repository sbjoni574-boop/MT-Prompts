services:
  - type: web
    name: mt-prompts
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATA_DIR
        value: /var/data
    disk:
      name: mt-prompts-data
      mountPath: /var/data
      sizeGB: 1
